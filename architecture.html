<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统架构图 - 可缩放</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
    }
    #svg-container {
      width: 100vw;
      height: 100vh;
    }
    #svg-container svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<div id="svg-container"></div>

<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
<script>
  fetch('./architecture_dark_v3.svg')
    .then(response => response.text())
    .then(svgText => {
      document.getElementById('svg-container').innerHTML = svgText;

      const svgElement = document.querySelector('#svg-container svg');
      if (!svgElement) {
        console.error('SVG 加载失败');
        return;
      }

      svgPanZoom(svgElement, {
        zoomEnabled: true,
        controlIconsEnabled: true,   // 显示右上角缩放控制按钮
        fit: true,                    // 自动适应视口
        center: true,                 // 居中显示
        minZoom: 0.5,
        maxZoom: 20,
        zoomScaleSensitivity: 0.3,
        mouseWheelZoomEnabled: true,
        dblClickZoomEnabled: true
      });
    })
    .catch(err => {
      console.error('加载 SVG 失败:', err);
    });
</script>

</body>
</html>
